apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-cred
spec:
  refreshInterval: "7500s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-cred
    creationPolicy: Owner
  data:
    - secretKey: a
      remoteRef:
        key: kv/db-cred
        property: a
