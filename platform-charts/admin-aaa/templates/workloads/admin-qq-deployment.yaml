apiVersion: apps/v1
kind: Deployment
metadata:
  name: qq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qq
  template:
    metadata:
      labels:
        app: qq
    spec:
      containers:
        - name: qq
          image: docker.io/qq:qq
          volumeMounts:
            - name: b
              mountPath: /data2
            - name: b
              mountPath: /data

      volumes:
        - name: b
          persistentVolumeClaim:
            claimName: b
        - name: b
          persistentVolumeClaim:
            claimName: b

