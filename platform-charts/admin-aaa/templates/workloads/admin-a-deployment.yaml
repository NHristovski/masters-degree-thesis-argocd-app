apiVersion: apps/v1
kind: Deployment
metadata:
  name: a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a
  template:
    metadata:
      labels:
        app: a
    spec:
      containers:
        - name: a
          image: docker.io/a:a
          env:
            - name: BBB
              value: "BBB"
          volumeMounts:
            - name: data2
              mountPath: /data
          ports:
            - containerPort: 80
      volumes:
        - name: data2
          persistentVolumeClaim:
            claimName: data2