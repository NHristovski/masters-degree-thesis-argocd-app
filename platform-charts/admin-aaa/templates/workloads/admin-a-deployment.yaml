apiVersion: apps/v1
kind: Deployment
metadata:
  name: a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a
  template:
    metadata:
      labels:
        app: a
    spec:
      containers:
        - name: a
          image: a/a:a
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - containerPort: 80
          env:
            - name: A
              valueFrom:
                secretKeyRef:
                  name: A
                  key: A
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data