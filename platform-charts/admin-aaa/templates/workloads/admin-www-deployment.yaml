apiVersion: apps/v1
kind: Deployment
metadata:
  name: www
spec:
  replicas: 1
  selector:
    matchLabels:
      app: www
  template:
    metadata:
      labels:
        app: www
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: C
              value: "C"
          env:
            - name: B
              value: "bbbb"
          env:
            - name: AAA
              valueFrom:
                secretKeyRef:
                  name: A
                  key: A
