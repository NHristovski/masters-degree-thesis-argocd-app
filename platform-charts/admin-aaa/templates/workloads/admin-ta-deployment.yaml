apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ta
  template:
    metadata:
      labels:
        app: ta
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
          env:
            - name: AAA
              value: "AA"
          env:
