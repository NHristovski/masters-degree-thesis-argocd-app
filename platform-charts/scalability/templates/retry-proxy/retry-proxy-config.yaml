apiVersion: v1
kind: ConfigMap
metadata:
  name: retry-proxy-config
data:
  default.conf: |
    server {
      listen 80;

      location / {
        proxy_pass http://keda-add-ons-http-interceptor-proxy:8080;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 15s;
        proxy_read_timeout 15s;
      }
    }