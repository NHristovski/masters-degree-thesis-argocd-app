apiVersion: apps/v1
kind: Deployment
metadata:
  name: retry-proxy
  namespace: scalability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retry-proxy
  template:
    metadata:
      labels:
        app: retry-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: config
          configMap:
            name: retry-proxy-config