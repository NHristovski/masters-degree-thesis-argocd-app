apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-function
  annotations:
    caplatform.dpdns.org/public: "true"
    caplatform.dpdns.org/contextpath: "e-nginx=>api-function23.192.168.100.250.sslip.io"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: e-cilium-gateway
      namespace: cilium
      sectionName: https
  hostnames:
    - "api-function23.192.168.100.250.sslip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: retry-proxy
          port: 80
          weight: 1
