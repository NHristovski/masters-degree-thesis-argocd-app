apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db
spec:
  refreshInterval: "7500s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db
    creationPolicy: Owner
  data:
    - secretKey: ddd
      remoteRef:
        key: kv/db
        property: ddd
