apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-auto-unseal
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: unseal
              image: hashicorp/vault:1.15
              env:
                - name: VAULT_ADDR
                  value: "http://vault.{{ .Release.Namespace }}.svc.cluster.local:8200"
                - name: KEY1
                  valueFrom:
                    secretKeyRef:
                      name: vault-unseal-keys
                      key: key1
                - name: KEY2
                  valueFrom:
                    secretKeyRef:
                      name: vault-unseal-keys
                      key: key2
                - name: KEY3
                  valueFrom:
                    secretKeyRef:
                      name: vault-unseal-keys
                      key: key3
              command:
                - sh
                - -c
                - |
                  set -e
                  STATUS=$(vault status -format=json | jq -r .sealed)
                  if [ "$STATUS" = "true" ]; then
                    echo "Vault is sealed. Unsealing..."
                    vault operator unseal $KEY1
                    vault operator unseal $KEY2
                    vault operator unseal $KEY3
                  else
                    echo "Vault already unsealed."
                  fi