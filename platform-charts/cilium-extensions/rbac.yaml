apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cilium-operator-secrets-sync
  namespace: cilium-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cilium-operator-secrets-sync-binding
  namespace: cilium-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cilium-operator-secrets-sync
subjects:
  - kind: ServiceAccount
    name: cilium-operator
    namespace: kube-system