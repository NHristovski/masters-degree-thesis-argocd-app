apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-file-storage
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: cephfs.csi.ceph.com
parameters:
  clusterID: 280ba296-4f3c-4086-94a7-a3f9d46e4a24
  fsName: cephfs
  pool: KubeFS_data
  csi.storage.k8s.io/provisioner-secret-name: ceph-file-storage-auth
  csi.storage.k8s.io/provisioner-secret-namespace: ceph
  csi.storage.k8s.io/controller-expand-secret-name: "ceph-file-storage-auth
  csi.storage.k8s.io/controller-expand-secret-namespace: ceph
  csi.storage.k8s.io/node-stage-secret-name: ceph-file-storage-auth
  csi.storage.k8s.io/node-stage-secret-namespace: ceph
reclaimPolicy: Delete
allowVolumeExpansion: true
mountOptions:
  - discard