secrets:
  sealed: false

grafana:
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
    readOnlyRootFilesystem: true

  extraEmptyDirMounts:
    - name: tmp
      mountPath: /tmp
    - name: plugins-temp
      mountPath: /var/lib/grafana/plugins
    - name: provisioning-temp
      mountPath: /etc/grafana/provisioning/notifiers

  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  envFromSecret: grafana-secrets

  env:
    GF_SECURITY_ALLOW_EMBEDDING: true
    GF_CORS_ENABLED: true
    GF_CORS_ALLOW_CREDENTIALS: true
    GF_CORS_ALLOWED_ORIGINS: "https://grafana.192.168.100.243.sslip.io/,http://grafana.monitoring.svc.cluster.local,https://grafana.monitoring.svc.cluster.local"
    GF_CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
    GF_CORS_ALLOWED_HEADERS: "accept,authorization,content-type,origin"

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server.monitoring.svc.cluster.local
          access: proxy
          isDefault: true
#        - name: loki-project001
#          access: proxy
#          type: loki
#          url: http://nginx-loki-proxy.monitoring.svc.cluster.local:80
#          basicAuth: true
#          basicAuthUser: project001
#          secureJsonData:
#            basicAuthPassword: $__file{/etc/secrets/PROJECT001_PASSWORD}
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      kubernetes:
        gnetId: 10000
        revision: 1
        datasource: Prometheus
  grafana.ini:
    database:
      type: postgres
      host: grafana-postgres.monitoring.svc.cluster.local:5432
      name: ${POSTGRES_DB}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      ssl_mode: disable
    server:
      domain: https://grafana.192.168.100.243.sslip.io/
      root_url: https://grafana.192.168.100.243.sslip.io/
    auth.generic_oauth:
      enabled: true
      name: KEYCLOAK
      allow_sign_up: true
      client_id: grafana
      client_secret: ${OAUTH_CLIENT_SECRET}
      scopes: openid email profile offline_access roles
      email_attribute_path: email
      login_attribute_path: username
      name_attribute_path: full_name
      auth_url: https://keycloak.192.168.100.243.sslip.io/realms/grafana/protocol/openid-connect/auth
      token_url: http://keycloak.keycloak.svc.cluster.local:80/realms/grafana/protocol/openid-connect/token
      api_url: http://keycloak.keycloak.svc.cluster.local:80/realms/grafana/protocol/openid-connect/userinfo
      signout_redirect_url: https://keycloak.192.168.100.243.sslip.io/realms/grafana/protocol/openid-connect/logout
      role_attribute_path: contains(realm_access.roles[*], 'GrafanaSuperadmin') && 'GrafanaAdmin' || contains(realm_access.roles[*], 'GrafanaAdmin') && 'Admin' || contains(realm_access.roles[*], 'GrafanaEditor') && 'Editor' || 'Viewer'
      role_attribute_strict: true
      allow_assign_grafana_admin: true
    auth:
      disable_login_form: true
      oauth_auto_login: false
      oauth_skip_org_role_update_sync: false
      skip_org_role_sync: false
    users:
      auto_assign_org: true
      auto_assign_org_role: Viewer
      auto_assign_org_id: 1
    security:
      disable_initial_admin_creation: true
      allow_embedding: true
      cookie_secure: false
  ingress:
    enabled: false

  route:
    main:
      enabled: true

      hostnames:
        - grafana.192.168.100.243.sslip.io

      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: default-cilium-gateway
          namespace: cilium
          sectionName: https

      matches:
        - path:
            type: PathPrefix
            value: /
  persistence:
    enabled: true
    storageClass: ceph-block-storage
    size: 2Gi

#  extraSecretMounts:
#    - name: loki-datasource-secret
#      secretName: loki-datasource-secret
#      mountPath: /etc/secrets
#      readOnly: true
#  extraConfigmapMounts:
#    - name: istio-dashboard-configmap
#      mountPath: /var/lib/grafana/dashboards/default/istio.json
#      subPath: "istio.json"
#      configMap: istio-dashboard
#      readOnly: true
#    - name: springboot-dashboard-configmap
#      mountPath: /var/lib/grafana/dashboards/default/springboot.json
#      subPath: "springboot.json"
#      configMap: springboot-dashboard
#      readOnly: true

loki:
  deploymentMode: SingleBinary
  gateway:
    enabled: false
  test:
    enabled: false
  lokiCanary:
    enabled: false
  loki:
    auth_enabled: true
    commonConfig:
      replication_factor: 1
    storage:
      type: "filesystem"
      filesystem:
        chunks_directory: "/var/loki/chunks"
        rules_directory: "/var/loki/rules"
    limits_config:
      retention_period: 72h
      retention_stream:
        - selector: '{namespace=~".+"}'
          priority: 1
          period: 72h
    compactor:
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem
    schemaConfig:
      configs:
        - from: 2024-04-01
          object_store: filesystem
          store: tsdb
          schema: v13
          index:
            prefix: index_
            period: 24h

    rulerConfig:
      storage:
        type: local

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: ceph-block-storage
      size: 5Gi
      existingClaim: loki-data-pvc
    extraVolumeMounts:
      - name: storage
        mountPath: /var/loki
        subPath: loki
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0


prometheus:
  server:
    securityContext:
      runAsUser: 65534
      runAsNonRoot: true
      runAsGroup: 65534
      fsGroup: 65534
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
      readOnlyRootFilesystem: true
    persistentVolume:
      enabled: true
      storageClass: ceph-block-storage
      size: 5Gi
      existingClaim: prometheus-data-pvc

  prometheus-pushgateway:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  kube-state-metrics:
    enabled: true
  alertmanager:
    enabled: false