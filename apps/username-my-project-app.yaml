apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: username-my-project
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: testing
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://github.com/NHristovski/masters-degree-thesis-argocd-app.git
      path: platform-charts/username-my-project
      targetRevision: main
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
