apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: custom
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: custom
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: https://github.com/NHristovski/masters-degree-thesis-argocd-app.git
      path: deployments/custom
      targetRevision: main
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
