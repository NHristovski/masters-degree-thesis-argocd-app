apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-testing-scalability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: testscalability
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://github.com/NHristovski/masters-degree-thesis-argocd-app.git
      path: user-charts/admin-testing-scalability
      targetRevision: main
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
