apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: fun-http-scaler
  annotations:
    httpscaledobject.keda.sh/skip-scaledobject-creation: "false"
spec:
  hosts:
    - fun.192.168.100.244.sslip.io
  scaleTargetRef:
    name: fun
    kind: Deployment
    apiVersion: apps/v1
    service: fun
    port: 80
  replicas:
    min: 0
    max: 2
  scaledownPeriod: 120
  scalingMetric:
    requestRate:
      granularity: 1s
      targetValue: 50
      window: 30s
