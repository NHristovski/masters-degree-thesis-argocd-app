apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: test
spec:
  refreshInterval: "7500s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: test
    creationPolicy: Owner
  data:
    - secretKey: TEST
      remoteRef:
        key: kv/test
        property: TEST
