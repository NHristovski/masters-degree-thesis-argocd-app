apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:1.27-alpine
          env:
            - name: e
              value: "e"
            - name: d
              value: "d"
            - name: c
              value: "c"
            - name: b
              value: "bbbb"
            - name: a
              value: "a"
            - name: DB
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: secret
          volumeMounts:
            - name: dv
              mountPath: /data
          ports:
            - containerPort: 80
      volumes:
        - name: dv
          persistentVolumeClaim:
            claimName: dv