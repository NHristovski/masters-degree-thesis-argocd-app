apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics
  template:
    metadata:
      labels:
        app: metrics
    spec:
      containers:
        - name: prom-prometheus-example-app
          image: docker.io/prom/prometheus-example-app:latest
          ports:
            - containerPort: 8080
