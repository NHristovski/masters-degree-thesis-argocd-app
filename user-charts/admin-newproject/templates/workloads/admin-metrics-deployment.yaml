apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-metrics
  template:
    metadata:
      labels:
        app: admin-metrics
    spec:
      containers:
        - name: metrics-generator-tabajara
          image: docker.io/labbsr0x/metrics-generator-tabajara:latest
          ports:
            - containerPort: 3000
