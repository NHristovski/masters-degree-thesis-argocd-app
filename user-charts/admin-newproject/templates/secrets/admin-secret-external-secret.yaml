apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secret
spec:
  refreshInterval: "7500s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: secret
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: kv/secret
        property: secret
