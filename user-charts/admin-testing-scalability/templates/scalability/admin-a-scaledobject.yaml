apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: a
spec:
  scaleTargetRef:
    name: a
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-prometheus-server.monitoring.svc.cluster.local
        metricName: custom
        threshold: "10"
        query: |
          sum(rate(httv_server_requests_active_seconds_sum{job="a"}[1m]))
