apiVersion: apps/v1
kind: Deployment
metadata:
  name: y
spec:
  replicas: 1
  selector:
    matchLabels:
      app: y
  template:
    metadata:
      labels:
        app: y
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:1.27-alpine
          ports:
            - containerPort: 80
