apiVersion: apps/v1
kind: Deployment
metadata:
  name: publictest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publictest
  template:
    metadata:
      labels:
        app: publictest
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: SECRET_TEST
              valueFrom:
                secretKeyRef:
                  name: secret-from-public-url
                  key: PASS
            - name: DB_TEST
              value: "OK"
