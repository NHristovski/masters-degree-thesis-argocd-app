apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: publictest
  annotations:
    caplatform.dpdns.org/public: "true"
    caplatform.dpdns.org/contextpath: "e-myapp=>myapp.192.168.100.250.sslip.io"
spec:
  parentRefs:
    - name: e-cilium-gateway
      sectionName: https
      namespace: cilium
  hostnames:
    - "myapp.192.168.100.250.sslip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: publictest
          port: 80
