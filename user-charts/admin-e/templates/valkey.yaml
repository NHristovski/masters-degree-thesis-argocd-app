apiVersion: hyperspike.io/v1
kind: Valkey
metadata:
  name: valkey
spec:
  # --- Auth ---
  anonymousAuth: false
  servicePassword:
    name: valkey-password
    key: password
    optional: false

  # --- Images ---
  image: ghcr.io/hyperspike/valkey:8.1.4
  exporterImage: ghcr.io/hyperspike/valkey-sidecar:v0.0.51

  # --- Topology ---
  nodes: 1
  replicas: 0
  clusterDomain: cluster.local
  clusterPreferredEndpointType: ip

  # --- Prometheus ---
  prometheus: true
  serviceMonitor: true

  # --- TLS ---
  tls: false

  # --- Resources ---
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # --- Storage ---
{{/*  storage:*/}}
{{/*    spec:*/}}
{{/*      accessModes:*/}}
{{/*        - ReadWriteOnce*/}}
{{/*      storageClassName: ceph-block-storage*/}}
{{/*      resources:*/}}
{{/*        requests:*/}}
{{/*          storage: 5Gi*/}}

  # --- Scheduling ---
  volumePermissions: false
  nodeSelector: {}
  tolerations: []

  # --- External Access ---
  externalAccess:
    enabled: false


