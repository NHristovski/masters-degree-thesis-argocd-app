apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-a-password
spec:
  refreshInterval: "7500s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: b
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kv/valkey-a-password
        property: password
