apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-appdb-password
spec:
  refreshInterval: "7500s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mariadb-appdb-password
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: kv/mariadb-appdb-password
        property: DATABASE_PASSWORD
