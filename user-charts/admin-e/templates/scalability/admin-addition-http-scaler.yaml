apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: addition-http-scaler
  annotations:
    httpscaledobject.keda.sh/skip-scaledobject-creation: "false"
spec:
  hosts:
    - addition.192.168.100.250.sslip.io
  scaleTargetRef:
    name: addition
    kind: Deployment
    apiVersion: apps/v1
    service: addition
    port: 8080
  replicas:
    min: 0
    max: 2
  scaledownPeriod: 120
  scalingMetric:
    requestRate:
      granularity: 1s
      targetValue: 50
      window: 30s
