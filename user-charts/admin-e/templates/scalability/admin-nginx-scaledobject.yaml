apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: nginx
spec:
  scaleTargetRef:
    name: nginx
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-prometheus-server.monitoring.svc.cluster.local
        metricName: custom
        threshold: "10"
        query: |
          rate(http_requests_total{job="nginx"}[1])
