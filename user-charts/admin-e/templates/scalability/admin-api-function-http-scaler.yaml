apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: api-function-http-scaler
  annotations:
    httpscaledobject.keda.sh/skip-scaledobject-creation: "false"
spec:
  hosts:
    - api-function2.192.168.100.250.sslip.io
  scaleTargetRef:
    name: api-function
    kind: Deployment
    apiVersion: apps/v1
    service: api-function
    port: 80
  replicas:
    min: 0
    max: 2
  scaledownPeriod: 120
  scalingMetric:
    requestRate:
      granularity: 1s
      targetValue: 50
      window: 30s
