apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: testfunc-http-scaler
  annotations:
    httpscaledobject.keda.sh/skip-scaledobject-creation: "false"
spec:
  hosts:
    - testfunc
  scaleTargetRef:
    name: testfunc
    kind: Deployment
    apiVersion: apps/v1
    service: testfunc
    port: 80
  replicas:
    min: 0
    max: 2
  scaledownPeriod: 5
  scalingMetric:
    requestRate:
      granularity: 1s
      targetValue: 50
      window: 30s
