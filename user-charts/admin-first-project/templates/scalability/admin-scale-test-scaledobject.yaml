apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: scale-test
spec:
  scaleTargetRef:
    name: scale-test
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-prometheus-server.monitoring.svc.cluster.local
        metricName: custom
        threshold: "500"
        query: |
          sum(increase(http_server_requests_seconds_count{job="scale-test"}[1m]))
