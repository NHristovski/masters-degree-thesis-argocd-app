apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-presentation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-presentation
  template:
    metadata:
      labels:
        app: nginx-presentation
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:1.27-alpine
          volumeMounts:
            - name: data-volume
              mountPath: /var/www/logs
          ports:
            - containerPort: 80
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: mariadb-appdb-password
                  key: DATABASE_PASSWORD
            - name: DATABASE_URL
              value: "mariadb.mariadb.svc.cluster.local:3306/appdb"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: API_KEY
                  key: API_KEY
            - name: DATABASE_NAME
              value: "mydatabase"
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: data-volume