apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-presentation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-presentation
  template:
    metadata:
      labels:
        app: nginx-presentation
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: API_KEY
                  key: API_KEY
            - name: DATABASE_NAME
              value: "mydatabase"
