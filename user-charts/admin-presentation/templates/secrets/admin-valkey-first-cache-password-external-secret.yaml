apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-first-cache-password
spec:
  refreshInterval: "7500s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: valkey-first-cache-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kv/valkey-first-cache-password
        property: password
