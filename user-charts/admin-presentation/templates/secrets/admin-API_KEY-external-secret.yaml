apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: API_KEY
spec:
  refreshInterval: "7500s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: API_KEY
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: kv/API_KEY
        property: API_KEY
