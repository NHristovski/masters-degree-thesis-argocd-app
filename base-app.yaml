apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: master-degree
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    path: apps
    repoURL: 'https://github.com/NHristovski/masters-degree-thesis-argocd-app'
    targetRevision: HEAD
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
